name: Build & Publish Android Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure pre-installed Android SDK & accept licenses
        run: |
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$ANDROID_SDK_DIR" ]; then
            echo "Android SDK directory not found at $ANDROID_SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_DIR/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36.1" > /dev/null || true
          "$SDKMANAGER" --install "build-tools;36.1.0" > /dev/null || true

      - name: Ensure debug.keystore exists for debugConfig
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Compile Debug APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ARGS=(
            :app:assembleDebug
            --no-daemon
            --no-configuration-cache
            --stacktrace
            -Pkotlin.compiler.execution.strategy=in-process
          )
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew || true
            ./gradlew "${GRADLE_ARGS[@]}" 2>&1 | tee gradle-build.log
          else
            gradle "${GRADLE_ARGS[@]}" 2>&1 | tee gradle-build.log
          fi

      - name: Surface Gradle failure summary
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            echo "### Gradle Failure Tail" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILURE:|What went wrong:|Execution failed|Could not|error:|Exception" gradle-build.log | head -n 15 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Upload Gradle build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Verify APK output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Debug APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Debug APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-debug' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Debug APK' }}
          body: |
            Automated Android Debug APK build from `${{ github.sha }}`.

            Direct download:
            `https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk`
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
